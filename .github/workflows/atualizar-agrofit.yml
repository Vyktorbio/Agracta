name: Atualizar catálogo Agrofit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: atualizar-agrofit
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: python3 tools/agrofit-atualiza.py
      - run: npm test
      - name: Abrir revisão do catálogo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/agrofit.json data/agrofit-culturas.json; then exit 0; fi
          if [ "$(gh pr list --state open --search 'in:title "Atualizar catálogo Agrofit"' --json number --jq length)" != 0 ]; then exit 0; fi
          branch="automation/agrofit-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/agrofit.json data/agrofit-culturas.json sw.js
          git commit -m 'Atualizar catálogo Agrofit a partir dos dados abertos do MAPA'
          git push origin "$branch"
          gh pr create --title 'Atualizar catálogo Agrofit' --body-file docs/AGROFIT-PR.md --head "$branch"
