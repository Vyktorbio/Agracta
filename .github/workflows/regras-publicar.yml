# Regras do banco — publicar (lacuna L8 da validação)
#
# Quando um merge no main muda o firestore.rules:
#   1. os testes das regras rodam no emulador (os mesmos do PR);
#   2. o job "publicar" PARA e espera aprovação no ambiente regras-producao;
#   3. aprovado, publica pela API de regras do Firebase, confere a leitura de
#      volta e guarda o registro (artefato "registro-regras", 90 dias).
#
# A aprovação existe por causa da ORDEM. Regra nova no ar antes do app novo
# nos aparelhos trava a sincronização de quem ainda está com o app antigo.
# Então: merge → abrir o app duas vezes em cada aparelho → (se a mudança pede,
# dar os papéis no Painel Admin) → aprovar aqui.
#
# Para sair de uma regra que travou algum aparelho: Actions → "Regras do
# banco — publicar" → Run workflow → acao "voltar" e, em versao_anterior, o
# nome que está em "antes" no registro da publicação. Também pede aprovação.
#
# Configuração (uma vez): docs/VALIDACAO-SISTEMA.md, apêndice A.
name: Regras do banco — publicar
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
    inputs:
      acao:
        description: 'publicar = o firestore.rules do main; voltar = uma versão anterior'
        type: choice
        options: [publicar, voltar]
        default: publicar
      versao_anterior:
        description: 'Só para voltar: projects/agracta-vyktorbio/rulesets/… (em "antes", no registro da publicação)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: regras-banco-publicar
  cancel-in-progress: false
jobs:
  testar:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.acao == 'publicar')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:regras
      - run: node tests/test_regras_banco.js

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment: regras-producao
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar e conferir
        env:
          FIREBASE_CHAVE_SA: ${{ secrets.FIREBASE_REGRAS_PUBLICAR }}
        run: node tools/regras-banco.cjs publicar --registro registro-regras.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-regras
          path: registro-regras.json
          if-no-files-found: ignore
          retention-days: 90

  voltar:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.acao == 'voltar'
    runs-on: ubuntu-latest
    environment: regras-producao
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Voltar à versão anterior
        env:
          FIREBASE_CHAVE_SA: ${{ secrets.FIREBASE_REGRAS_PUBLICAR }}
          VERSAO: ${{ inputs.versao_anterior }}
        run: node tools/regras-banco.cjs voltar "$VERSAO" --registro registro-regras.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registro-regras
          path: registro-regras.json
          if-no-files-found: ignore
          retention-days: 90
