name: Conferir Agracta e permissões
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:regras
