name: Conferir Agracta e permissões
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      # O portao e o mesmo do duplo clique, mas a pergunta aqui e outra: este PR
      # esta sadio, nao "vou arrastar agora". Sem --pull-request, todo PR que nao
      # mexe no sw.js reprovava por CACHE igual ao do ar -- que e o correto para ele.
      - run: npm test -- --pull-request
      - run: npm run test:regras
